plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = project.mod_version
group = mod_group

base {
    archivesName = "${mod_id}-${minecraft_version}-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

fabricApi {
    // Regenerates the dynamic registry JSON (world generation, dimensions, trims, damage types) from the bootstraps in
    // data/resources/registries. Output goes to build/ and is synced into src/generated/resources by hand.
    configureDataGeneration {
        createSourceSet = true
        modId = "aether_datagen"
        outputDirectory = file("build/datagen-output")
        addToResources = false
        client = false
    }
    configureTests {
        createSourceSet = true
        modId = "aether_gametest"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

processResources {
    exclude '.cache/'

    def replaceProperties = [
        version               : project.version,
        mod_id                : mod_id,
        mod_name              : mod_name,
        mod_license           : mod_license,
        mod_url               : mod_url,
        mod_update            : mod_update,
        mod_tracker           : mod_tracker,
        mod_credits           : mod_credits,
        mod_authors           : mod_authors,
        mod_description       : mod_description,
        minecraft_version     : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        loader_version        : loader_version
    ]

    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net" }
    maven { url = "https://maven.blamejared.com" }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        url = "https://maven2.bai.lol"
        content {
            includeGroup("lol.bai")
        }
    }
    exclusiveContent {
        forRepository {
            ivy {
                name = "WthitGitHubRelease"
                url = uri("https://github.com/CasseShimada/wthit/releases/download")
                patternLayout {
                    artifact "[revision]/wthit-26.2-fabric-[revision](-[classifier]).[ext]"
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModule("com.github.casseshimada.wthit", "wthit")
        }
    }
}

configurations {
    wthitApiArtifact
}

def viewerCompatTest = (project.findProperty("viewerCompatTest") ?: "wthit").toString()
if (!(viewerCompatTest in ["none", "jade", "wthit", "both"])) {
    throw new GradleException("viewerCompatTest must be one of: none, jade, wthit, both")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"

    compileOnly "maven.modrinth:jade:${project.jade_version}"
    compileOnly "com.github.casseshimada.wthit:wthit:${project.wthit_version}:api"
    wthitApiArtifact "com.github.casseshimada.wthit:wthit:${project.wthit_version}:api"

    if (viewerCompatTest in ["wthit", "both"]) {
        gametestRuntimeOnly "com.github.casseshimada.wthit:wthit:${project.wthit_version}"
        gametestRuntimeOnly "lol.bai:badpackets:fabric-0.12.2"
    }
    if (viewerCompatTest in ["jade", "both"]) {
        gametestRuntimeOnly "maven.modrinth:jade:${project.jade_version}"
    }

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

}

def apiCompatProperties = [
        "diggusMaximusCompatClasses",
        "diggusMaximusCompatJar",
        "carryOnCompatClasses",
        "carryOnCompatJar"
]
def apiCompatGameTests = apiCompatProperties.every { project.findProperty(it) }
if (apiCompatGameTests) {
    sourceSets.gametest.java.srcDir("src/compatTest/api/java")
    dependencies {
        gametestCompileOnly files(project.property("diggusMaximusCompatClasses"))
        gametestRuntimeOnly files(project.property("diggusMaximusCompatJar"))
        gametestCompileOnly files(project.property("carryOnCompatClasses"))
        gametestRuntimeOnly files(project.property("carryOnCompatJar"))
    }
}

tasks.named("processGametestResources") {
    inputs.property("apiCompatGameTests", apiCompatGameTests)
    doLast {
        if (apiCompatGameTests) {
            File descriptor = destinationDir.toPath().resolve("fabric.mod.json").toFile()
            def json = new groovy.json.JsonSlurper().parse(descriptor)
            json.entrypoints["fabric-gametest"] <<
                    "com.aetherteam.aether.blockentity.ThreeModFunctionalGameTests"
            descriptor.text = groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(json)) + System.lineSeparator()
        }
    }
}

tasks.register("verifyWthitApiArtifact") {
    inputs.files(configurations.wthitApiArtifact)
    doLast {
        File artifact = configurations.wthitApiArtifact.singleFile
        String digest = java.security.MessageDigest.getInstance("SHA-256")
                .digest(artifact.bytes)
                .encodeHex()
                .toString()
        if (artifact.length() != 118219L || digest != project.wthit_api_sha256) {
            throw new GradleException(
                    "Unexpected WTHIT API artifact: ${artifact.name}, ${artifact.length()} bytes, SHA-256 ${digest}")
        }
    }
}

tasks.named("compileJava") {
    dependsOn(tasks.named("verifyWthitApiArtifact"))
}

tasks.named("runClientGameTest") {
    jvmArgs "-Daether.viewerCompatTest=${viewerCompatTest}"
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << '-Xmaxerrs' << '400'
}

compileJava {
    options.incremental = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/stevelittlefish/The-Aether-Lite'
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
